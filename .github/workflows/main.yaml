name: Build, Test and Publish

on:
  merge_group:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          always-auth: false
          cache: 'npm'

      - name: Update npm
        if: startsWith(matrix.node-version, '18.') || startsWith(matrix.node-version, '20.')
        run: npm i -g npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Update npm
        run: npm i -g npm

      - name: Install dependencies
        run: npm ci

      # Audits production and dev dependencies; fails on any advisory that is
      # not explicitly allowlisted in audit-ci.jsonc.
      - name: Audit dependencies
        run: npx --yes audit-ci@7.1.0 --config ./audit-ci.jsonc

      - name: Check for circular dependencies
        run: npx madge --circular . --extensions ts,js

      # Run Prettier
      - name: Run Prettier
        run: npm run format:check

      # Run ESLint
      - name: Run eslint
        run: npm run lint

      - name: Run tests
        run: npm test

  verify-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify versions match
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          PACKAGE_VERSION=$(jq -r '.version' package.json)

          echo "Tag: $TAG_VERSION | Manifest: $MANIFEST_VERSION | package.json: $PACKAGE_VERSION"

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "ERROR: Tag version does not match manifest version"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "ERROR: package.json version does not match manifest version"
            exit 1
          fi
          echo "All versions verified: $TAG_VERSION"

  # Publishes with npm trusted publishing (OIDC): no long-lived npm token.
  # Requires a trusted publisher configured on npmjs.com for this package:
  # repository openfga/frontend-utils, workflow main.yaml.
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-version]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@openfga'
          always-auth: false
          cache: 'npm'

      # Dependency install scripts are not needed to build, and this job can
      # mint OIDC tokens, so do not run them here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate tag and determine npm tag
        id: npm-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Validate tag format
          if [[ ! "$TAG" =~ ^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+(-(alpha|beta|rc)\.[[:digit:]]+)?$ ]]; then
            echo "Error: Tag '$TAG' does not match the required format"
            echo "Valid formats:"
            echo "  - v1.2.3"
            echo "  - v1.2.3-alpha.1"
            echo "  - v1.2.3-beta.1"
            echo "  - v1.2.3-rc.1"
            exit 1
          fi

          # Determine npm tag
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ -alpha ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -beta ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -rc ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1; pin the CLI used to publish.
      - name: Publish to npm
        run: npx -y npm@11.9.0 publish --tag ${{ steps.npm-tag.outputs.tag }}

  undraft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    permissions:
      contents: write
    uses: openfga/.github/.github/workflows/undraft-release.yml@835baf31562809ad9eb884c73efc5b79318f700f # pin@main
